services:

  wordpress:
    image: soulteary/sqlite-wordpress:7.1.0
    # or use: ghcr.io/soulteary/sqlite-wordpress:7.1.0
    restart: always
    ports:
      # Safe local default. Replace 127.0.0.1 only when intentionally publishing
      # the site through a firewall or TLS reverse proxy. Keep the recovery path
      # private or IP-allowlisted whenever the tool is enabled.
      - 127.0.0.1:8080:80
    environment:
      # Emergency site URL recovery stays disabled during normal operation.
      # To use the short-lived PASSWORD mode, export both host variables and
      # run `docker compose up -d --force-recreate`. Generate the password with:
      # `export WORDPRESS_SITE_URL_UPDATE_PASSWORD="$(openssl rand -base64 24)"`
      # `export WORDPRESS_SITE_URL_UPDATE_TOOL_ENABLED=true`
      WORDPRESS_SITE_URL_UPDATE_TOOL_ENABLED: "${WORDPRESS_SITE_URL_UPDATE_TOOL_ENABLED:-false}"
      WORDPRESS_SITE_URL_UPDATE_PASSWORD: "${WORDPRESS_SITE_URL_UPDATE_PASSWORD:-}"

      # TOKEN_FILE is preferred for shared or internet-reachable hosts. Uncomment
      # this line and the service/top-level secrets blocks below. Leave PASSWORD
      # unset or empty: TOKEN_FILE and PASSWORD are mutually exclusive.
      # WORDPRESS_SITE_URL_UPDATE_TOKEN_FILE: /run/secrets/site-url-update-token
    # secrets:
    #   - site-url-update-token
    volumes:
      - ./wordpress:/var/www/html

# Preferred TOKEN_FILE definition:
# secrets:
#   site-url-update-token:
#     file: ./secrets/site-url-update-token
