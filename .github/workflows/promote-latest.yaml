name: Promote latest

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

# Only latest-tag promotion is serialized. A pending signal may be replaced by
# GitHub, which is safe because every run promotes the highest repository tag
# that has a complete, matching manifest in both registries.
concurrency:
  group: promote-latest
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: soulteary/sqlite-wordpress
  GHCR_IMAGE: ghcr.io/soulteary/sqlite-wordpress

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select highest release tag
        id: release
        run: |
          set -euo pipefail
          mapfile -t versions < <(
            git tag --list \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V
          )
          if [[ "${#versions[@]}" -eq 0 ]]; then
            echo "::error::No stable semantic-version release tags found."
            exit 1
          fi
          version="${versions[${#versions[@]} - 1]}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify highest version in both registries
        id: manifest
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          expected_platforms=$'linux/amd64\nlinux/arm/v5\nlinux/arm/v6\nlinux/arm/v7\nlinux/arm64'

          inspect_version() {
            local image="$1"
            local output_name="$2"
            local raw=""
            local attempt
            local digest
            local platforms

            for attempt in {1..12}; do
              if raw="$(docker buildx imagetools inspect --raw "${image}:${RELEASE_VERSION}" 2>/dev/null)"; then
                break
              fi
              if [[ "${attempt}" -eq 12 ]]; then
                echo "::error::${image}:${RELEASE_VERSION} is not available."
                exit 1
              fi
              sleep 10
            done

            if ! jq -e '.schemaVersion == 2 and (.manifests | type == "array")' \
              <<< "${raw}" >/dev/null; then
              echo "::error::${image}:${RELEASE_VERSION} is not a manifest index."
              exit 1
            fi

            platforms="$(
              jq -r '
                .manifests[]
                | "\(.platform.os)/\(.platform.architecture)\(if .platform.variant then "/" + .platform.variant else "" end)"
              ' <<< "${raw}" | sort
            )"
            if [[ "${platforms}" != "${expected_platforms}" ]]; then
              echo "::error::Unexpected platforms for ${image}:${RELEASE_VERSION}."
              printf 'Expected:\n%s\nActual:\n%s\n' "${expected_platforms}" "${platforms}"
              exit 1
            fi

            digest="sha256:$(printf '%s' "${raw}" | sha256sum | awk '{print $1}')"
            printf -v "${output_name}" '%s' "${digest}"
          }

          inspect_version "${REGISTRY_IMAGE}" dockerhub_digest
          inspect_version "${GHCR_IMAGE}" ghcr_digest
          if [[ "${dockerhub_digest}" != "${ghcr_digest}" ]]; then
            echo "::error::Registry manifest indexes differ: ${dockerhub_digest} != ${ghcr_digest}"
            exit 1
          fi
          echo "digest=${dockerhub_digest}" >> "${GITHUB_OUTPUT}"

      - name: Promote highest version to latest
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for image in "${REGISTRY_IMAGE}" "${GHCR_IMAGE}"; do
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}:${RELEASE_VERSION}"
          done

      - name: Verify latest manifests
        env:
          EXPECTED_DIGEST: ${{ steps.manifest.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for image in "${REGISTRY_IMAGE}" "${GHCR_IMAGE}"; do
            raw="$(docker buildx imagetools inspect --raw "${image}:latest")"
            digest="sha256:$(printf '%s' "${raw}" | sha256sum | awk '{print $1}')"
            if [[ "${digest}" != "${EXPECTED_DIGEST}" ]]; then
              echo "::error::${image}:latest is ${digest}, expected ${EXPECTED_DIGEST} from ${RELEASE_VERSION}."
              exit 1
            fi
          done
