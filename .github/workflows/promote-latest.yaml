name: Promote latest

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

# Promotion is serialized. Every run independently selects the newest complete,
# signed CalVer release, so an older release finishing later cannot roll aliases
# backwards.
concurrency:
  group: promote-latest
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: soulteary/sqlite-wordpress
  GHCR_IMAGE: ghcr.io/soulteary/sqlite-wordpress

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select newest complete CalVer release
        id: release
        run: |
          set -euo pipefail
          expected_platforms=$'linux/amd64\nlinux/arm/v5\nlinux/arm/v6\nlinux/arm/v7\nlinux/arm64'
          candidates_file="$(mktemp)"
          trap 'rm -f "${candidates_file}"' EXIT

          while IFS= read -r version; do
            [[ "${version}" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})-r([1-9][0-9]*)$ ]] || continue
            release_date="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            normalized_date="$(date -u -d "${release_date//./-}" '+%Y.%m.%d' 2>/dev/null)" || continue
            [[ "${normalized_date}" == "${release_date}" ]] || continue
            printf '%s %s %s %s %s\n' \
              "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}" "${BASH_REMATCH[4]}" "${version}"
          done < <(git tag --list) \
            | sort -k1,1nr -k2,2nr -k3,3nr -k4,4nr \
            | awk '{print $5}' > "${candidates_file}"

          if [[ ! -s "${candidates_file}" ]]; then
            echo "::error::No YYYY.MM.DD-rN release tags found."
            exit 1
          fi

          inspect_complete() {
            local image="$1"
            local version="$2"
            local output_name="$3"
            local raw
            local platforms
            local attestation_count
            local certificate_identity
            local digest

            raw="$(docker buildx imagetools inspect --raw "${image}:${version}" 2>/dev/null)" || return 1
            jq -e '.schemaVersion == 2 and (.manifests | type == "array")' <<< "${raw}" >/dev/null || return 1
            platforms="$(
              jq -r '
                .manifests[]
                | select(.platform.os != "unknown" and .platform.architecture != "unknown")
                | "\(.platform.os)/\(.platform.architecture)\(if .platform.variant then "/" + .platform.variant else "" end)"
              ' <<< "${raw}" | sort
            )"
            [[ "${platforms}" == "${expected_platforms}" ]] || return 1
            attestation_count="$(
              jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' <<< "${raw}"
            )"
            [[ "${attestation_count}" -eq 5 ]] || return 1
            digest="sha256:$(printf '%s' "${raw}" | sha256sum | awk '{print $1}')"
            certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@refs/tags/${version}"
            cosign verify \
              --certificate-identity "${certificate_identity}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${image}@${digest}" >/dev/null 2>&1 || return 1
            printf -v "${output_name}" '%s' "${digest}"
          }

          selected_version=""
          selected_digest=""
          while IFS= read -r candidate; do
            dockerhub_digest=""
            ghcr_digest=""
            if inspect_complete "${REGISTRY_IMAGE}" "${candidate}" dockerhub_digest \
              && inspect_complete "${GHCR_IMAGE}" "${candidate}" ghcr_digest \
              && [[ "${dockerhub_digest}" == "${ghcr_digest}" ]]; then
              selected_version="${candidate}"
              selected_digest="${dockerhub_digest}"
              break
            fi
            echo "::notice::Skipping incomplete or mismatched release ${candidate}."
          done < "${candidates_file}"

          if [[ -z "${selected_version}" ]]; then
            echo "::error::No complete matching CalVer release exists in both registries."
            exit 1
          fi

          echo "version=${selected_version}" >> "${GITHUB_OUTPUT}"
          echo "date=${selected_version%-r*}" >> "${GITHUB_OUTPUT}"
          echo "digest=${selected_digest}" >> "${GITHUB_OUTPUT}"

      - name: Promote verified mutable aliases
        env:
          RELEASE_DATE: ${{ steps.release.outputs.date }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for image in "${REGISTRY_IMAGE}" "${GHCR_IMAGE}"; do
            docker buildx imagetools create \
              --tag "${image}:${RELEASE_DATE}" \
              --tag "${image}:latest" \
              "${image}:${RELEASE_VERSION}"
          done

      - name: Verify promoted aliases
        env:
          EXPECTED_DIGEST: ${{ steps.release.outputs.digest }}
          RELEASE_DATE: ${{ steps.release.outputs.date }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for image in "${REGISTRY_IMAGE}" "${GHCR_IMAGE}"; do
            for alias in "${RELEASE_DATE}" latest; do
              raw="$(docker buildx imagetools inspect --raw "${image}:${alias}")"
              digest="sha256:$(printf '%s' "${raw}" | sha256sum | awk '{print $1}')"
              if [[ "${digest}" != "${EXPECTED_DIGEST}" ]]; then
                echo "::error::${image}:${alias} is ${digest}, expected ${EXPECTED_DIGEST} from ${RELEASE_VERSION}."
                exit 1
              fi
            done
          done
