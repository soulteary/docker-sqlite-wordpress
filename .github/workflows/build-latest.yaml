name: Release Latest

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

env:
  REGISTRY_IMAGE: soulteary/sqlite-wordpress
  GHCR_IMAGE: ghcr.io/soulteary/sqlite-wordpress

jobs:
  # Build each platform on its own runner in parallel. amd64 and arm64 use
  # native runners (no QEMU) so the Rust extension compiles at full speed; the
  # 32-bit ARM variants run under QEMU but skip the Rust build entirely.
  #
  # Each platform is pushed by digest to BOTH registries. Digests are exported
  # separately per registry so the merge job can assemble a manifest list that
  # only references digests that exist in that registry.
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            qemu: false
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            qemu: false
          - platform: linux/arm/v7
            runner: ubuntu-26.04-arm
            qemu: true
          - platform: linux/arm/v6
            runner: ubuntu-26.04-arm
            qemu: true
          - platform: linux/arm/v5
            runner: ubuntu-26.04-arm
            qemu: true
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to Docker Hub by digest
        id: build-dockerhub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push to GHCR by digest
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/dockerhub /tmp/digests/ghcr
          dh_digest="${{ steps.build-dockerhub.outputs.digest }}"
          ghcr_digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "/tmp/digests/dockerhub/${dh_digest#sha256:}"
          touch "/tmp/digests/ghcr/${ghcr_digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-platform image digests into a single multi-arch manifest,
  # one manifest per registry using only that registry's digests.
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        run: |
          cd /tmp/digests/dockerhub
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:${{ github.ref_name }}" \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)
          cd /tmp/digests/ghcr
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:${{ github.ref_name }}" \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ github.ref_name }}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${{ github.ref_name }}"
