name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image_changed: ${{ steps.changes.outputs.image_changed }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="/tmp/shellcheck.tar.xz"
          curl --location --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error \
            -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar --no-same-owner -xJf "${archive}" -C /tmp
          echo "/tmp/shellcheck-v${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: Detect image changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          image_changed=true
          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]] \
            && [[ -n "${BASE_SHA}" ]] \
            && [[ ! "${BASE_SHA}" =~ ^0+$ ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" \
            && git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- \
              .github/workflows/ci.yaml \
              .dockerignore \
              Dockerfile \
              docker-entrypoint-sqlite.sh \
              scripts/validate-release.sh \
              sqlite-database-integration-loader.php \
              sqlite-diagnostics.php \
              sqlite-select-id-key-fix.php \
              tool-update-site-url.php \
              tests/image-smoke-site-url.php; then
            image_changed=false
          fi
          echo "image_changed=${image_changed}" >> "${GITHUB_OUTPUT}"

      - name: Validate release consistency
        id: release
        run: |
          set -euo pipefail
          mapfile -t release_versions < <(
            sed -nE 's/^(ARG WORDPRESS_IMAGE=|FROM )wordpress:([0-9]+\.[0-9]+\.[0-9]+)-php[^[:space:]@]+-apache(@sha256:[0-9a-f]{64})?([[:space:]].*)?$/\2/p' Dockerfile \
              | sort -u
          )
          if [[ "${#release_versions[@]}" -ne 1 ]]; then
            echo "Expected one WordPress release version in Dockerfile." >&2
            exit 1
          fi
          ./scripts/validate-release.sh "${release_versions[0]}"
          echo "release_version=${release_versions[0]}" >> "${GITHUB_OUTPUT}"

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(find . -type f -name '*.sh' -print0)
          shellcheck "${shell_files[@]}"

      - name: Lint PHP files
        run: |
          set -euo pipefail
          while IFS= read -r -d '' php_file; do
            php -l "${php_file}"
          done < <(find . -type f -name '*.php' -print0)

      - name: Run repository tests
        run: |
          set -euo pipefail
          while IFS= read -r -d '' shell_test; do
            bash "${shell_test}"
          done < <(find tests -maxdepth 1 -type f -name 'test-*.sh' -print0 2>/dev/null || true)
          while IFS= read -r -d '' php_test; do
            php "${php_test}"
          done < <(find tests -maxdepth 1 -type f -name 'test-*.php' -print0 2>/dev/null || true)

      - name: Install and run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="/tmp/actionlint.tar.gz"
          curl --location --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error \
            -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar --no-same-owner -xzf "${archive}" -C /tmp actionlint
          /tmp/actionlint

  image-smoke:
    needs: validate
    if: needs.validate.outputs.image_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned WordPress base image
        run: ./scripts/validate-release.sh "${{ needs.validate.outputs.release_version }}" --verify-upstream

      - name: Build amd64 image
        run: docker build --pull --tag sqlite-wordpress:test .

      - name: Verify packaged runtime
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php sqlite-wordpress:test -m | grep -Fxq wp_mysql_parser
          docker run --rm --entrypoint bash sqlite-wordpress:test -ceu '
            test -f /usr/src/wordpress/wp-content/db.php
            test -f /usr/src/wordpress/wp-content/mu-plugins/sqlite-database-integration/load.php
            test -f /usr/src/wordpress/wp-content/mu-plugins/sqlite-database-integration-loader.php
            test -f /usr/src/wordpress/wp-content/mu-plugins/sqlite-diagnostics.php
            test -f /usr/src/wordpress/wp-content/mu-plugins/sqlite-select-id-key-fix.php
            test -f /usr/src/wordpress/tool-update-site-url.php
            php -l /usr/src/wordpress/wp-content/db.php
            php -l /usr/src/wordpress/tool-update-site-url.php
          '
          # PHP variables below are intentionally protected from shell expansion.
          # shellcheck disable=SC2016
          docker run --rm sqlite-wordpress:test php -r '
            require "/var/www/html/wp-load.php";
            $driver = $GLOBALS["wpdb"]->get_driver();
            foreach (["beginTransaction", "commit", "rollBack", "inTransaction"] as $method) {
              if (!method_exists($driver, $method)) {
                fwrite(STDERR, "SQLite driver transaction method unavailable: {$method}\n");
                exit(1);
              }
            }
            $driver->beginTransaction();
            if (!$driver->inTransaction()) {
              fwrite(STDERR, "SQLite driver did not enter a transaction.\n");
              exit(1);
            }
            $driver->rollBack();
          '
          docker run --rm \
            --volume "${PWD}/tests/image-smoke-site-url.php:/tmp/image-smoke-site-url.php:ro" \
            sqlite-wordpress:test php /tmp/image-smoke-site-url.php
