name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      resume_existing:
        description: Validate and sign manifests already created by this release
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  CI_RECIPES_VERSION: 83ccd6f83d7e7ef40f5d6faf2e11960f1de74a78
  REGISTRY_IMAGE: soulteary/sqlite-wordpress
  GHCR_IMAGE: ghcr.io/soulteary/sqlite-wordpress

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      resume_existing: ${{ steps.registry.outputs.resume_existing }}
    steps:
      - name: Checkout protected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: false

      - name: Install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Validate release tag and project versions
        id: release
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REF_TYPE}" != "tag" ]]; then
            echo "::error::Release workflow must run from an existing protected tag, not ${RELEASE_REF_TYPE}."
            exit 1
          fi
          if [[ "${RELEASE_REF_PROTECTED}" != "true" ]]; then
            echo "::error::Release tag ${RELEASE_REF_NAME} is not covered by an active GitHub ruleset."
            exit 1
          fi
          if [[ "${RELEASE_EVENT_NAME}" == "release" && "${RELEASE_EVENT_TAG}" != "${RELEASE_REF_NAME}" ]]; then
            echo "::error::Published release tag ${RELEASE_EVENT_TAG} does not match workflow ref ${RELEASE_REF_NAME}."
            exit 1
          fi

          tag_object_type="$(git cat-file -t "refs/tags/${RELEASE_REF_NAME}")"
          case "${tag_object_type}" in
            tag|commit) ;;
            *)
              echo "::error::Unsupported release tag object type: ${tag_object_type}."
              exit 1
              ;;
          esac
          echo "Release tag ${RELEASE_REF_NAME} uses ${tag_object_type} object type."

          source_sha="$(git rev-parse "refs/tags/${RELEASE_REF_NAME}^{commit}")"
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "${source_sha}" != "${checkout_sha}" ]]; then
            echo "::error::Checkout ${checkout_sha} does not match release tag commit ${source_sha}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${source_sha}" refs/remotes/origin/main; then
            echo "::error::Release tag ${RELEASE_REF_NAME} must point to a commit already on main."
            exit 1
          fi

          ci-recipes docker-sqlite-wordpress validate-release "${RELEASE_REF_NAME}"
          echo "version=${RELEASE_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned WordPress base image
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          ci-recipes docker-sqlite-wordpress validate-release
          "${RELEASE_VERSION}"
          --verify-upstream

      - name: Select fresh or resumable publication
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          RESUME_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_existing }}
        run: |
          set -euo pipefail
          declare -A manifest_json=()
          declare -A manifest_digest=()
          existing_count=0

          for image in "${REGISTRY_IMAGE}" "${GHCR_IMAGE}"; do
            if raw="$(docker buildx imagetools inspect --raw "${image}:${RELEASE_VERSION}" 2>/tmp/inspect-error)"; then
              manifest_json["${image}"]="${raw}"
              manifest_digest["${image}"]="sha256:$(printf '%s' "${raw}" | sha256sum | awk '{print $1}')"
              existing_count=$((existing_count + 1))
              continue
            fi

            inspect_output="$(</tmp/inspect-error)"
            if ! grep -Eqi 'manifest unknown|not found' <<< "${inspect_output}"; then
              echo "::error::Unable to verify that ${image}:${RELEASE_VERSION} is unused."
              printf '%s\n' "${inspect_output}"
              exit 1
            fi
          done

          if [[ "${RESUME_REQUESTED}" == "true" ]]; then
            if [[ "${existing_count}" -ne 2 ]]; then
              echo "::error::Resume requires the exact manifest to exist in both registries; found ${existing_count} of 2."
              exit 1
            fi

            for image in "${REGISTRY_IMAGE}" "${GHCR_IMAGE}"; do
              if ! jq -e \
                --arg version "${RELEASE_VERSION}" \
                --arg revision "${SOURCE_SHA}" \
                --arg source "https://github.com/${GITHUB_REPOSITORY}" \
                --arg licenses "Apache-2.0 AND GPL-2.0-or-later" \
                '.schemaVersion == 2
                 and .annotations["org.opencontainers.image.version"] == $version
                 and .annotations["org.opencontainers.image.revision"] == $revision
                 and .annotations["org.opencontainers.image.source"] == $source
                 and .annotations["org.opencontainers.image.licenses"] == $licenses' \
                <<< "${manifest_json["${image}"]}" >/dev/null; then
                echo "::error::${image}:${RELEASE_VERSION} does not belong to source ${SOURCE_SHA}."
                exit 1
              fi
            done

            if [[ "${manifest_digest["${REGISTRY_IMAGE}"]}" != "${manifest_digest["${GHCR_IMAGE}"]}" ]]; then
              echo "::error::Existing registry manifests do not have the same digest."
              exit 1
            fi
            echo "resume_existing=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${existing_count}" -ne 0 ]]; then
            echo "::error::${RELEASE_VERSION} already exists in ${existing_count} registry/registries; CalVer release tags are immutable."
            echo "::error::Dispatch this protected tag with resume_existing enabled only to validate and sign an interrupted matching release."
            exit 1
          fi
          echo "resume_existing=false" >> "${GITHUB_OUTPUT}"

  build:
    needs: preflight
    if: needs.preflight.outputs.resume_existing != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            qemu: false
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm
            qemu: true
          - platform: linux/arm/v6
            runner: ubuntu-24.04-arm
            qemu: true
          - platform: linux/arm/v5
            runner: ubuntu-24.04-arm
            qemu: true
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build once and push to both registries by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          build-args: |
            IMAGE_VERSION=${{ needs.preflight.outputs.version }}
            IMAGE_REVISION=${{ needs.preflight.outputs.source_sha }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: >-
            type=image,"name=${{ env.REGISTRY_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export and verify registry digests
        env:
          PLATFORM_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${PLATFORM_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid platform digest: ${PLATFORM_DIGEST}"
            exit 1
          fi
          for image in "${REGISTRY_IMAGE}" "${GHCR_IMAGE}"; do
            docker buildx imagetools inspect "${image}@${PLATFORM_DIGEST}" >/dev/null
          done
          mkdir -p /tmp/digests/dockerhub /tmp/digests/ghcr
          touch "/tmp/digests/dockerhub/${PLATFORM_DIGEST#sha256:}"
          touch "/tmp/digests/ghcr/${PLATFORM_DIGEST#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-sign:
    needs:
      - preflight
      - build
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.build.result == 'success' || needs.preflight.outputs.resume_existing == 'true')
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      RESUME_EXISTING: ${{ needs.preflight.outputs.resume_existing }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: false

      - name: Install CI recipes
        env:
          GOBIN: ${{ runner.temp }}/ci-recipes-bin
        run: |
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Download digests
        if: env.RESUME_EXISTING != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned manifests
        if: env.RESUME_EXISTING != 'true'
        run: |
          set -euo pipefail

          create_version_manifest() {
            local image="$1"
            local digest_dir="$2"
            local -a digests=()
            local -a sources=()

            mapfile -t digests < <(find "${digest_dir}" -maxdepth 1 -type f -printf '%f\n' | sort)
            if [[ "${#digests[@]}" -ne 5 ]]; then
              echo "::error::Expected 5 digests for ${image}, found ${#digests[@]}."
              exit 1
            fi

            for digest in "${digests[@]}"; do
              if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::Invalid digest file for ${image}: ${digest}"
                exit 1
              fi
              sources+=("${image}@sha256:${digest}")
            done

            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.version=${RELEASE_VERSION}" \
              --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
              --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "index:org.opencontainers.image.licenses=Apache-2.0 AND GPL-2.0-or-later" \
              --tag "${image}:${RELEASE_VERSION}" \
              "${sources[@]}"
          }

          create_version_manifest "${REGISTRY_IMAGE}" /tmp/digests/dockerhub
          create_version_manifest "${GHCR_IMAGE}" /tmp/digests/ghcr

      - name: Verify manifests, SBOM, and provenance
        id: manifest
        run: |
          set -euo pipefail
          expected_platforms=$'linux/amd64\nlinux/arm/v5\nlinux/arm/v6\nlinux/arm/v7\nlinux/arm64'
          dockerhub_digest=""
          ghcr_digest=""

          verify_image() {
            local image="$1"
            local output_name="$2"
            local raw
            local platforms
            local digest
            local attestation_count
            local sbom
            local provenance
            local expected_evidence_platforms

            raw="$(docker buildx imagetools inspect --raw "${image}:${RELEASE_VERSION}")"
            if ! jq -e \
              --arg version "${RELEASE_VERSION}" \
              --arg revision "${SOURCE_SHA}" \
              --arg source "https://github.com/${GITHUB_REPOSITORY}" \
              --arg licenses "Apache-2.0 AND GPL-2.0-or-later" \
              '.schemaVersion == 2
               and .annotations["org.opencontainers.image.version"] == $version
               and .annotations["org.opencontainers.image.revision"] == $revision
               and .annotations["org.opencontainers.image.source"] == $source
               and .annotations["org.opencontainers.image.licenses"] == $licenses' \
              <<< "${raw}" >/dev/null; then
              echo "::error::Unexpected OCI release annotations for ${image}:${RELEASE_VERSION}."
              exit 1
            fi
            platforms="$(
              jq -r '
                .manifests[]
                | select(.platform.os != "unknown" and .platform.architecture != "unknown")
                | "\(.platform.os)/\(.platform.architecture)\(if .platform.variant then "/" + .platform.variant else "" end)"
              ' <<< "${raw}" | sort
            )"
            if [[ "${platforms}" != "${expected_platforms}" ]]; then
              echo "::error::Unexpected runtime platforms for ${image}:${RELEASE_VERSION}."
              printf 'Expected:\n%s\nActual:\n%s\n' "${expected_platforms}" "${platforms}"
              exit 1
            fi

            attestation_count="$(
              jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' <<< "${raw}"
            )"
            if [[ "${attestation_count}" -ne 5 ]]; then
              echo "::error::Expected one attestation manifest per runtime platform for ${image}, found ${attestation_count}."
              exit 1
            fi

            expected_evidence_platforms="$(
              jq -Rsc 'split("\n") | map(select(length > 0))' <<< "${expected_platforms}"
            )"
            sbom="$(docker buildx imagetools inspect "${image}:${RELEASE_VERSION}" --format '{{ json .SBOM }}')"
            if ! ci-recipes docker-sqlite-wordpress validate-buildx-evidence SPDX "${expected_evidence_platforms}" <<< "${sbom}"; then
              echo "::error::Incomplete per-platform SPDX SBOM for ${image}:${RELEASE_VERSION}."
              exit 1
            fi
            provenance="$(docker buildx imagetools inspect "${image}:${RELEASE_VERSION}" --format '{{ json .Provenance }}')"
            if ! ci-recipes docker-sqlite-wordpress validate-buildx-evidence SLSA "${expected_evidence_platforms}" <<< "${provenance}"; then
              echo "::error::Incomplete per-platform SLSA provenance for ${image}:${RELEASE_VERSION}."
              exit 1
            fi

            digest="sha256:$(printf '%s' "${raw}" | sha256sum | awk '{print $1}')"
            printf -v "${output_name}" '%s' "${digest}"
          }

          verify_image "${REGISTRY_IMAGE}" dockerhub_digest
          verify_image "${GHCR_IMAGE}" ghcr_digest
          if [[ "${dockerhub_digest}" != "${ghcr_digest}" ]]; then
            echo "::error::Registry manifest indexes differ: ${dockerhub_digest} != ${ghcr_digest}"
            exit 1
          fi
          echo "digest=${dockerhub_digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign and verify immutable manifests
        env:
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@${GITHUB_REF}"
          certificate_issuer="https://token.actions.githubusercontent.com"

          for image in "${REGISTRY_IMAGE}" "${GHCR_IMAGE}"; do
            cosign sign --yes "${image}@${MANIFEST_DIGEST}"
          done

          for image in "${REGISTRY_IMAGE}" "${GHCR_IMAGE}"; do
            ci-recipes docker-sqlite-wordpress verify-cosign-signature \
              "${image}@${MANIFEST_DIGEST}" \
              "${certificate_identity}" \
              "${certificate_issuer}"
          done

      - name: Publish release summary
        env:
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "## ${RELEASE_VERSION}"
            echo
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Manifest: \`${MANIFEST_DIGEST}\`"
            echo "- Platforms: amd64, arm64, arm/v7, arm/v6, arm/v5"
            echo "- Evidence: SPDX SBOM, max-mode SLSA provenance, Sigstore keyless signature"
          } >> "${GITHUB_STEP_SUMMARY}"
